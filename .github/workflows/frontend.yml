name: frontend

on:
  push:
    branches:
      - main
    paths: 
      - 'frontend/**'
      - '.github/**'

defaults:
  run:
    working-directory: frontend

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v3

        - uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::513636860721:role/udemy-github-actions-frontend-deployment-role
            aws-region: ap-northeast-1

        - run: aws s3 sync . s3://udemy-github-actions-s3-ohshima --exact-timestamps --region ap-northeast-1